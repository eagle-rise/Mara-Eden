<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eden Mara — Management System</title>
<style>
:root{
  --ink:#171513;--muted:#756d63;--paper:#f7f3ec;--card:#fffdfa;--line:#e7dfd4;
  --accent:#8a623d;--accent2:#b58a60;--green:#49634d;--red:#a64d43;--gold:#b08a3e;
  --shadow:0 10px 30px rgba(40,28,18,.08);--radius:16px;
}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--paper)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:260px;background:#171513;color:#fff;padding:22px 16px;position:fixed;left:0;top:0;bottom:0;z-index:20;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 22px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:10px}.brand b{font-family:Georgia,serif;font-size:20px;letter-spacing:3px}.brand small{display:block;color:#c8b9a8;margin-top:2px}
.nav{padding-top:16px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#cfc7bd;padding:12px;border-radius:11px;margin:3px 0;text-align:left}
.nav button:hover,.nav button.active{background:#2a2520;color:#fff}.nav .ico{width:22px;text-align:center}
.main{margin-left:260px;width:calc(100% - 260px);padding:24px 28px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.title h1{font-family:Georgia,serif;margin:0;font-size:31px}.title p{margin:5px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.danger{color:#fff;background:var(--red);border-color:var(--red)}.btn.ghost{background:transparent}
.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:13px}.stat .value{font-size:28px;font-weight:750;margin-top:8px}.stat .sub{font-size:12px;color:var(--muted);margin-top:5px}
.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}.card h3{font-family:Georgia,serif;margin:0 0 16px;font-size:19px}.section{margin-top:18px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:200px}
input,select,textarea{border:1px solid var(--line);background:#fffdf9;border-radius:9px;padding:10px 11px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:100px;resize:vertical}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.table td{font-size:14px}.table tr:last-child td{border-bottom:0}
.badge{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.badge.green{background:#e6eee7;color:#315137}.badge.red{background:#f5e4e1;color:#843a33}.badge.gold{background:#f3ead4;color:#795b20}.badge.gray{background:#eeeae4;color:#665e55}
.mini{font-size:12px;color:var(--muted)}.money{font-weight:750}.empty{text-align:center;padding:28px;color:var(--muted)}
.progress{height:8px;background:#eee7df;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.kpi-row{display:flex;justify-content:space-between;gap:12px}.chart{height:210px;display:flex;align-items:flex-end;gap:9px;padding:15px 4px 0;border-bottom:1px solid var(--line)}.bar{flex:1;min-width:14px;position:relative;background:var(--accent2);border-radius:6px 6px 0 0}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.product-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.product-card h4{margin:7px 0 4px}.product-card .price{font-weight:800}.product-card button{width:100%;margin-top:10px}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,16,12,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}.modal-backdrop.show{display:flex}.modal{background:var(--card);width:min(680px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal h2{font-family:Georgia,serif;margin:0 0 15px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:650}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 15%,#f8eee2,#ede5db)}.login-box{width:min(430px,92%);background:#fffdfa;border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:var(--shadow);text-align:center}.login-box img{width:220px;height:125px;object-fit:contain}.login-box h1{font-family:Georgia,serif;margin:4px 0}.login-box p{color:var(--muted)}.login-box form{text-align:left;margin-top:20px}.login-box .field{margin-bottom:12px}
.receipt{width:360px;background:white;padding:24px;margin:auto;font-family:Arial}.receipt .rlogo{width:110px;height:75px;object-fit:contain;display:block;margin:auto}.receipt h2{text-align:center;font-family:Georgia,serif;margin:3px}.receipt hr{border:0;border-top:1px dashed #999}.receipt table{width:100%;font-size:12px;border-collapse:collapse}.receipt td{padding:5px 0}.receipt .right{text-align:right}
.mobile-menu{display:none}
@media(max-width:950px){.sidebar{transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.main{margin-left:0;width:100%;padding:18px}.mobile-menu{display:inline-block}.stats{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.topbar{align-items:flex-start}.title h1{font-size:25px}}
@media(max-width:560px){.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions .hide-sm{display:none}}
@media print{body{background:white}.sidebar,.topbar,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.receipt{display:block!important}}
</style>
</head>

let db=load(); let currentUser=null; let page="dashboard"; let cart=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(DEMO)}catch(e){return structuredClone(DEMO)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return new Intl.NumberFormat("en-KE",{style:"currency",currency:db.settings.currency||"KES",maximumFractionDigits:0}).format(Number(n)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function id(){return Date.now()+Math.floor(Math.random()*999)}
function toast(msg){const x=document.createElement("div");x.textContent=msg;x.style.cssText="position:fixed;right:20px;bottom:20px;background:#171513;color:#fff;padding:13px 16px;border-radius:10px;z-index:100;font-size:13px";document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show")}
document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
function modal(title,body,actions=""){document.getElementById("modal").innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="btn" onclick="closeModal()">✕</button></div>${body}<div class="modal-actions">${actions||'<button class="btn" onclick="closeModal()">Close</button>'}</div>`;document.getElementById("modalBackdrop").classList.add("show")}

function login(){
document.getElementById("root").innerHTML=`<div class="login"><div class="login-box">
<img src="${LOGO}"><h1>Eden Mara</h1><p>Retail & inventory management</p>
<form onsubmit="doLogin(event)"><div class="field"><label>Email</label><input id="loginEmail" value="admin@edenmara.local" required></div>
<div class="field"><label>Password</label><input id="loginPass" type="password" value="admin123" required></div>
<button class="btn primary" style="width:100%;margin-top:8px">Sign in</button>
<div class="mini" style="margin-top:14px;text-align:center">Demo account: admin@edenmara.local / admin123</div></form>
</div></div>`}
function doLogin(e){e.preventDefault();const u=db.users.find(x=>x.email===loginEmail.value&&x.password===loginPass.value);if(!u){toast("Invalid login");return}currentUser=u;render()}
function logout(){currentUser=null;cart=[];login()}

const nav=[["dashboard","⌂","Dashboard"],["pos","▣","Point of Sale"],["inventory","◈","Inventory"],["sales","▤","Sales"],["customers","♙","Customers"],["suppliers","♧","Suppliers"],["expenses","−","Expenses"],["reports","▥","Reports"],["settings","⚙","Settings"]];
function shell(content,title,sub){
document.getElementById("root").innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><img src="${LOGO}"><div><b>EDEN</b><small>MARA</small></div></div><nav class="nav">${nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join("")}</nav><div style="margin-top:25px;padding:12px;color:#a99f94;font-size:12px;border-top:1px solid rgba(255,255,255,.1)">Signed in as<br><strong style="color:#fff">${esc(currentUser.name)}</strong><br>${esc(currentUser.role)}</div><button class="nav button" style="color:#d9b9a8" onclick="logout()">↪ Sign out</button></aside>
<main class="main"><div class="topbar"><div class="title"><div class="actions"><button class="btn mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div><h1>${title}</h1><p>${sub||""}</p></div></div></div><div class="actions"><button class="btn" onclick="backup()">Export</button><button class="btn accent" onclick="quickAdd()">＋ Add</button></div></div>${content}</main></div>`}
function go(p){page=p;cart=[];render()}
function render(){if(!currentUser)return login();({dashboard:dashboard,pos:pos,inventory:inventory,sales:sales,customers:customers,suppliers:suppliers,expenses:expenses,reports:reports,settings:settings}[page]||dashboard)()}

function dashboard(){
const revenue=db.sales.reduce((s,x)=>s+x.total,0), expensesTotal=db.expenses.reduce((s,x)=>s+x.amount,0), units=db.sales.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0), low=db.products.filter(p=>p.stock<=p.reorder).length;
const recent=[...db.sales].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);
const byCat={};db.products.forEach(p=>byCat[p.category]=(byCat[p.category]||0)+p.stock*p.price);
shell(`<div class="grid stats">
<div class="stat"><div class="label">Total Sales</div><div class="value">${money(revenue)}</div><div class="sub">${db.sales.length} transactions</div></div>
<div class="stat"><div class="label">Units Sold</div><div class="value">${units}</div><div class="sub">Across all sales</div></div>
<div class="stat"><div class="label">Expenses</div><div class="value">${money(expensesTotal)}</div><div class="sub">Recorded expenses</div></div>
<div class="stat"><div class="label">Low Stock</div><div class="value">${low}</div><div class="sub">${low?'Items need attention':'Stock levels healthy'}</div></div></div>
<div class="grid two section">
<div class="card"><h3>Recent Sales</h3>${recent.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Total</th></tr></thead><tbody>${recent.map(s=>`<tr><td>${esc(s.receipt)}</td><td>${s.date}</td><td>${esc(s.customer)}</td><td class="money">${money(s.total)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No sales yet. Open Point of Sale to record your first sale.</div>`}</div>
<div class="card"><h3>Inventory Value by Category</h3>${Object.keys(byCat).map(c=>`<div style="margin:13px 0"><div class="kpi-row"><span>${esc(c)}</span><b>${money(byCat[c])}</b></div><div class="progress" style="margin-top:6px"><i style="width:${Math.min(100,byCat[c]/Math.max(...Object.values(byCat))*100)}%"></i></div></div>`).join("")||'<div class="empty">No products</div>'}</div></div>
<div class="grid two section"><div class="card"><h3>Low Stock Alerts</h3>${db.products.filter(p=>p.stock<=p.reorder).map(p=>`<div class="kpi-row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(p.name)}<br><small class="mini">${esc(p.sku)}</small></span><span class="badge red">${p.stock} left</span></div>`).join("")||'<div class="empty">All products are above reorder levels.</div>'}</div>
<div class="card"><h3>Quick Actions</h3><div class="grid three"><button class="btn" onclick="go('pos')">New Sale</button><button class="btn" onclick="productForm()">Add Product</button><button class="btn" onclick="customerForm()">Add Customer</button></div></div></div>`,`Dashboard`,`Overview of Eden Mara operations`)
}

function pos(){
const cats=[...new Set(db.products.map(p=>p.category))];let shown=db.products;
shell(`<div class="grid two">
<div class="card"><h3>Products</h3><div class="toolbar"><input class="search" id="posSearch" placeholder="Search products or SKU..." oninput="filterPOS()"><select id="posCat" onchange="filterPOS()"><option value="">All categories</option>${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div class="product-grid" id="posProducts">${productCards(shown)}</div></div>
<div class="card"><h3>Current Sale</h3><div class="toolbar"><select id="saleCustomer" style="width:100%">${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div id="cartArea">${cartView()}</div></div></div>`,`Point of Sale`,`Create receipts and update stock automatically`)
}
function productCards(arr){return arr.map(p=>`<div class="product-card"><span class="badge gray">${esc(p.category)}</span><h4>${esc(p.name)}</h4><div class="mini">${esc(p.sku)} · ${p.stock} in stock</div><div class="price" style="margin-top:7px">${money(p.price)}</div><button class="btn primary" ${p.stock<1?'disabled':''} onclick="addCart(${p.id})">${p.stock<1?'Out of stock':'Add to sale'}</button></div>`).join("")||'<div class="empty">No matching products.</div>'}
function filterPOS(){const q=(document.getElementById("posSearch")?.value||"").toLowerCase(),c=document.getElementById("posCat")?.value||"";document.getElementById("posProducts").innerHTML=productCards(db.products.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q))&&(!c||p.category===c)))}
function addCart(pid){const p=db.products.find(x=>x.id===pid),item=cart.find(x=>x.id===pid);if(!p||p.stock<1)return;if(item){if(item.qty<p.stock)item.qty++;else return}else cart.push({id:p.id,qty:1,price:p.price});document.getElementById("cartArea").innerHTML=cartView()}
function cartView(){if(!cart.length)return `<div class="empty">Cart is empty.<br><small>Add products from the left.</small></div>`;const subtotal=cart.reduce((s,i)=>s+i.qty*i.price,0),tax=subtotal*(db.settings.tax||0)/100,total=subtotal+tax;return `<div>${cart.map(i=>{const p=db.products.find(x=>x.id===i.id);return `<div class="kpi-row" style="padding:11px 0;border-bottom:1px solid var(--line)"><div><b>${esc(p.name)}</b><div class="mini">${money(i.price)} each</div></div><div style="display:flex;gap:6px;align-items:center"><button class="btn" onclick="cartQty(${i.id},-1)">−</button><b>${i.qty}</b><button class="btn" onclick="cartQty(${i.id},1)">+</button><button class="btn" onclick="cartRemove(${i.id})">×</button></div></div>`}).join("")}</div><div style="margin-top:15px"><div class="kpi-row"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="kpi-row" style="margin-top:8px"><span>Tax (${db.settings.tax||0}%)</span><b>${money(tax)}</b></div><div class="kpi-row" style="margin-top:13px;font-size:20px"><span>Total</span><b>${money(total)}</b></div><button class="btn accent" style="width:100%;margin-top:16px" onclick="completeSale()">Complete Sale & Print Receipt</button><button class="btn" style="width:100%;margin-top:8px" onclick="cart=[];document.getElementById('cartArea').innerHTML=cartView()">Clear Cart</button></div>`}
function cartQty(pid,d){const i=cart.find(x=>x.id===pid),p=db.products.find(x=>x.id===pid);if(!i)return;i.qty+=d;if(i.qty<1)cart=cart.filter(x=>x.id!==pid);if(i.qty>p.stock)i.qty=p.stock;document.getElementById("cartArea").innerHTML=cartView()}
function cartRemove(pid){cart=cart.filter(x=>x.id!==pid);document.getElementById("cartArea").innerHTML=cartView()}
function completeSale(){if(!cart.length)return;const customer=db.customers.find(c=>c.id==document.getElementById("saleCustomer").value)||db.customers[0];const subtotal=cart.reduce((s,i)=>s+i.qty*i.price,0),tax=subtotal*(db.settings.tax||0)/100,total=subtotal+tax;const sale={id:id(),receipt:"EM-"+new Date().getFullYear()+"-"+String(db.sales.length+1).padStart(4,"0"),date:today(),time:new Date().toLocaleTimeString(),customer:customer.name,customerId:customer.id,items:cart.map(i=>({productId:i.id,qty:i.qty,price:i.price})),subtotal,tax,total,payment:"Cash"};sale.items.forEach(i=>{const p=db.products.find(x=>x.id===i.productId);p.stock-=i.qty});db.sales.push(sale);save();printReceipt(sale);cart=[];pos()}

function inventory(){
const q=(window.invQ||"");shell(`<div class="card"><div class="toolbar"><input class="search" value="${esc(q)}" placeholder="Search inventory..." oninput="window.invQ=this.value;inventory()"><select onchange="window.invCat=this.value;inventory()"><option value="">All categories</option>${[...new Set(db.products.map(p=>p.category))].map(c=>`<option ${window.invCat===c?'selected':''}>${esc(c)}</option>`).join("")}</select><button class="btn primary" onclick="productForm()">＋ Product</button></div><div class="table-wrap"><table class="table"><thead><tr><th>SKU</th><th>Product</th><th>Category</th><th>Sell Price</th><th>Cost</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>${db.products.filter(p=>(!q||p.name.toLowerCase().includes(q.toLowerCase())||p.sku.toLowerCase().includes(q.toLowerCase()))&&(!window.invCat||p.category===window.invCat)).map(p=>`<tr><td>${esc(p.sku)}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.stock}</td><td>${p.stock<=p.reorder?'<span class="badge red">Reorder</span>':'<span class="badge green">Healthy</span>'}</td><td><button class="btn" onclick="productForm(${p.id})">Edit</button> <button class="btn" onclick="deleteProduct(${p.id})">Delete</button></td></tr>`).join("")||'<tr><td colspan="8" class="empty">No products found.</td></tr>'}</tbody></table></div></div>`,`Inventory`,`Products, pricing, stock levels and reorder thresholds`)
}
function productForm(pid){const p=pid?db.products.find(x=>x.id===pid):{sku:"",name:"",category:"Leather",price:0,cost:0,stock:0,reorder:5};modal(pid?"Edit Product":"Add Product",`<form id="productForm" onsubmit="saveProduct(event,${pid||0})"><div class="form-grid"><div class="field"><label>SKU</label><input name="sku" value="${esc(p.sku)}" required></div><div class="field"><label>Product name</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>Category</label><select name="category">${["Leather","Clothing","Traditional","Accessories","Other"].map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join("")}</select></div><div class="field"><label>Selling price</label><input name="price" type="number" min="0" value="${p.price}" required></div><div class="field"><label>Cost price</label><input name="cost" type="number" min="0" value="${p.cost}" required></div><div class="field"><label>Stock quantity</label><input name="stock" type="number" min="0" value="${p.stock}" required></div><div class="field"><label>Reorder level</label><input name="reorder" type="number" min="0" value="${p.reorder}" required></div></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('productForm').requestSubmit()">Save Product</button>`)}
function saveProduct(e,pid){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f);Object.assign(o,{id:pid?pid:id(),price:+o.price,cost:+o.cost,stock:+o.stock,reorder:+o.reorder});if(pid)db.products=db.products.map(p=>p.id===pid?o:p);else db.products.push(o);save();closeModal();inventory();toast("Product saved")}
function deleteProduct(pid){if(!confirm("Delete this product?"))return;db.products=db.products.filter(p=>p.id!==pid);save();inventory();toast("Product deleted")}

function sales(){
const q=window.salesQ||"";const rows=[...db.sales].reverse().filter(s=>!q||s.receipt.toLowerCase().includes(q.toLowerCase())||s.customer.toLowerCase().includes(q.toLowerCase()));shell(`<div class="card"><div class="toolbar"><input class="search" value="${esc(q)}" placeholder="Search receipt or customer..." oninput="window.salesQ=this.value;sales()"><button class="btn" onclick="exportCSV()">Export CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th>Items</th><th>Payment</th><th>Total</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.receipt)}</td><td>${s.date} ${s.time||""}</td><td>${esc(s.customer)}</td><td>${s.items.reduce((a,i)=>a+i.qty,0)}</td><td>${esc(s.payment)}</td><td class="money">${money(s.total)}</td><td><button class="btn" onclick="printReceipt(${s.id})">Receipt</button></td></tr>`).join("")||'<tr><td colspan="7" class="empty">No sales recorded.</td></tr>'}</tbody></table></div></div>`,`Sales`,`Transaction history and receipts`)
}
function customers(){
shell(`<div class="card"><div class="toolbar"><input class="search" id="custSearch" placeholder="Search customers..." oninput="customerRows()"><button class="btn primary" onclick="customerForm()">＋ Customer</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Purchases</th><th>Spend</th><th></th></tr></thead><tbody id="custRows"></tbody></table></div></div>`,`Customers`,`Customer contacts and purchase history`);customerRows()}
function customerRows(){const q=(document.getElementById("custSearch")?.value||"").toLowerCase(),el=document.getElementById("custRows");if(!el)return;el.innerHTML=db.customers.filter(c=>c.name.toLowerCase().includes(q)||c.phone.toLowerCase().includes(q)).map(c=>{const ss=db.sales.filter(s=>s.customerId===c.id);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${ss.length}</td><td class="money">${money(ss.reduce((a,s)=>a+s.total,0))}</td><td><button class="btn" onclick="customerForm(${c.id})">Edit</button></td></tr>`}).join("")||'<tr><td colspan="6" class="empty">No customers.</td></tr>'}
function customerForm(cid){const c=cid?db.customers.find(x=>x.id===cid):{name:"",phone:"",email:"",notes:""};modal(cid?"Edit Customer":"Add Customer",`<form id="customerForm" onsubmit="saveCustomer(event,${cid||0})"><div class="form-grid"><div class="field full"><label>Name</label><input name="name" value="${esc(c.name)}" required></div><div class="field"><label>Phone</label><input name="phone" value="${esc(c.phone)}"></div><div class="field"><label>Email</label><input name="email" value="${esc(c.email)}" type="email"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(c.notes)}</textarea></div></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('customerForm').requestSubmit()">Save Customer</button>`)}
function saveCustomer(e,cid){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=cid||id();if(cid)db.customers=db.customers.map(c=>c.id===cid?o:c);else db.customers.push(o);save();closeModal();customers();toast("Customer saved")}

function suppliers(){shell(`<div class="card"><div class="toolbar"><button class="btn primary" onclick="supplierForm()">＋ Supplier</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Supplier</th><th>Phone</th><th>Email</th><th>Products / Notes</th><th></th></tr></thead><tbody>${db.suppliers.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.phone)}</td><td>${esc(s.email)}</td><td>${esc(s.notes)}</td><td><button class="btn" onclick="supplierForm(${s.id})">Edit</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">No suppliers added.</td></tr>'}</tbody></table></div></div>`,`Suppliers`,`Supplier directory for leather, clothing and traditional stock`)
}
function supplierForm(sid){const s=sid?db.suppliers.find(x=>x.id===sid):{name:"",phone:"",email:"",notes:""};modal(sid?"Edit Supplier":"Add Supplier",`<form id="supplierForm" onsubmit="saveSupplier(event,${sid||0})"><div class="form-grid"><div class="field full"><label>Supplier name</label><input name="name" value="${esc(s.name)}" required></div><div class="field"><label>Phone</label><input name="phone" value="${esc(s.phone)}"></div><div class="field"><label>Email</label><input name="email" value="${esc(s.email)}"></div><div class="field full"><label>Notes</label><textarea name="notes">${esc(s.notes)}</textarea></div></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('supplierForm').requestSubmit()">Save Supplier</button>`)}
function saveSupplier(e,sid){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=sid||id();if(sid)db.suppliers=db.suppliers.map(s=>s.id===sid?o:s);else db.suppliers.push(o);save();closeModal();suppliers();toast("Supplier saved")}

function expenses(){shell(`<div class="card"><div class="toolbar"><button class="btn primary" onclick="expenseForm()">＋ Expense</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Payment</th><th>Amount</th><th></th></tr></thead><tbody>${[...db.expenses].reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${esc(e.payment)}</td><td class="money">${money(e.amount)}</td><td><button class="btn" onclick="deleteExpense(${e.id})">Delete</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">No expenses recorded.</td></tr>'}</tbody></table></div></div>`,`Expenses`,`Track operating costs and other business expenses`)
}
function expenseForm(){modal("Record Expense",`<form id="expenseForm" onsubmit="saveExpense(event)"><div class="form-grid"><div class="field"><label>Date</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Category</label><select name="category"><option>Stock Purchase</option><option>Transport</option><option>Rent</option><option>Utilities</option><option>Marketing</option><option>Staff</option><option>Other</option></select></div><div class="field full"><label>Description</label><input name="description" required></div><div class="field"><label>Payment method</label><select name="payment"><option>Cash</option><option>M-Pesa</option><option>Bank</option><option>Card</option></select></div><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step="0.01" required></div></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('expenseForm').requestSubmit()">Save Expense</button>`)}
function saveExpense(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=id();o.amount=+o.amount;db.expenses.push(o);save();closeModal();expenses();toast("Expense recorded")}
function deleteExpense(x){db.expenses=db.expenses.filter(e=>e.id!==x);save();expenses()}

function reports(){
const rev=db.sales.reduce((a,s)=>a+s.total,0), exp=db.expenses.reduce((a,e)=>a+e.amount,0), gross=db.sales.reduce((a,s)=>a+s.items.reduce((z,i)=>{const p=db.products.find(x=>x.id===i.productId);return z+i.qty*(i.price-(p?.cost||0))},0),0);
const top={};db.sales.forEach(s=>s.items.forEach(i=>{const p=db.products.find(x=>x.id===i.productId);if(p)top[p.name]=(top[p.name]||0)+i.qty}));const tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6);
shell(`<div class="grid stats"><div class="stat"><div class="label">Revenue</div><div class="value">${money(rev)}</div></div><div class="stat"><div class="label">Gross Margin</div><div class="value">${money(gross)}</div></div><div class="stat"><div class="label">Expenses</div><div class="value">${money(exp)}</div></div><div class="stat"><div class="label">Net After Expenses</div><div class="value">${money(gross-exp)}</div></div></div>
<div class="grid two section"><div class="card"><h3>Sales by Day</h3>${salesChart()}</div><div class="card"><h3>Top Products</h3>${tops.map((x,i)=>`<div class="kpi-row" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>${i+1}. ${esc(x[0])}</span><b>${x[1]} units</b></div>`).join("")||'<div class="empty">Sales data will appear here.</div>'}</div></div>
<div class="card section"><h3>Inventory Valuation</h3><div class="table-wrap"><table class="table"><thead><tr><th>Category</th><th>Units</th><th>Cost Value</th><th>Retail Value</th></tr></thead><tbody>${Object.entries(db.products.reduce((a,p)=>{a[p.category]??={u:0,c:0,r:0};a[p.category].u+=p.stock;a[p.category].c+=p.stock*p.cost;a[p.category].r+=p.stock*p.price;return a},{})).map(([c,v])=>`<tr><td>${esc(c)}</td><td>${v.u}</td><td>${money(v.c)}</td><td>${money(v.r)}</td></tr>`).join("")}</tbody></table></div></div>`,`Reports`,`Sales, margins, expenses and inventory valuation`)
}
function salesChart(){const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10);days.push({key,label:d.toLocaleDateString("en",{weekday:"short"}),value:db.sales.filter(s=>s.date===key).reduce((a,s)=>a+s.total,0)})}const max=Math.max(1,...days.map(d=>d.value));return `<div class="chart">${days.map(d=>`<div class="bar" style="height:${Math.max(4,d.value/max*170)}px" title="${money(d.value)}"><span>${d.label}</span></div>`).join("")}</div><div style="padding-top:28px;text-align:right;font-weight:700">${money(days.reduce((a,d)=>a+d.value,0))} last 7 days</div>`}

function settings(){
shell(`<div class="grid two"><div class="card"><h3>Shop Details</h3><form id="settingsForm" onsubmit="saveSettings(event)"><div class="form-grid"><div class="field full"><label>Business name</label><input name="shopName" value="${esc(db.settings.shopName)}"></div><div class="field full"><label>Tagline</label><input name="tagline" value="${esc(db.settings.tagline)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(db.settings.phone)}"></div><div class="field"><label>Email</label><input name="email" value="${esc(db.settings.email)}"></div><div class="field full"><label>Address</label><textarea name="address">${esc(db.settings.address)}</textarea></div><div class="field"><label>Currency</label><select name="currency"><option ${db.settings.currency==="KES"?"selected":""}>KES</option><option ${db.settings.currency==="USD"?"selected":""}>USD</option><option ${db.settings.currency==="EUR"?"selected":""}>EUR</option></select></div><div class="field"><label>Tax rate (%)</label><input name="tax" type="number" min="0" max="100" step=".01" value="${db.settings.tax}"></div></div><button class="btn primary" style="margin-top:15px">Save Settings</button></form></div>
<div class="card"><h3>Data & Security</h3><p class="mini">This version stores information locally in this browser. It is suitable as a standalone shop-management starter and does not provide secure multi-device/cloud synchronization.</p><div class="grid" style="margin-top:14px"><button class="btn" onclick="backup()">Export Full Backup (JSON)</button><button class="btn" onclick="restorePrompt()">Import Backup</button><button class="btn danger" onclick="resetData()">Reset Demo Data</button></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>User Accounts</h3>${db.users.map(u=>`<div class="kpi-row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span><b>${esc(u.name)}</b><br><small class="mini">${esc(u.email)} · ${esc(u.role)}</small></span><button class="btn" onclick="userForm(${u.id})">Edit</button></div>`).join("")}<button class="btn primary" style="margin-top:12px" onclick="userForm()">＋ User</button></div></div>`,`Settings`,`Business profile, tax, backups and local user accounts`)
}
function saveSettings(e){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.tax=+o.tax;db.settings=o;save();render();toast("Settings saved")}
function userForm(uid){const u=uid?db.users.find(x=>x.id===uid):{name:"",email:"",role:"Cashier",password:""};modal(uid?"Edit User":"Add User",`<form id="userForm" onsubmit="saveUser(event,${uid||0})"><div class="form-grid"><div class="field full"><label>Name</label><input name="name" value="${esc(u.name)}" required></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(u.email)}" required></div><div class="field"><label>Role</label><select name="role">${["Admin","Manager","Cashier"].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join("")}</select></div><div class="field full"><label>Password</label><input name="password" type="password" value="${esc(u.password)}" required></div></div></form>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="document.getElementById('userForm').requestSubmit()">Save User</button>`)}
function saveUser(e,uid){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));o.id=uid||id();if(uid)db.users=db.users.map(u=>u.id===uid?o:u);else db.users.push(o);save();closeModal();settings();toast("User saved")}
function quickAdd(){modal("Quick Add",`<div class="grid three"><button class="btn" onclick="closeModal();productForm()">Product</button><button class="btn" onclick="closeModal();customerForm()">Customer</button><button class="btn" onclick="closeModal();expenseForm()">Expense</button></div>`)}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="eden-mara-backup-"+today()+".json";a.click();URL.revokeObjectURL(a.href);toast("Backup exported")}
function restorePrompt(){modal("Import Backup",`<p class="mini">Choose an Eden Mara JSON backup previously exported from this system.</p><input type="file" id="backupFile" accept=".json" onchange="importBackup(event)">`,"<button class=\"btn\" onclick=\"closeModal()\">Cancel</button>")}
function importBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.products||!x.sales)throw Error();db=x;save();closeModal();render();toast("Backup imported")}catch{toast("Invalid backup file")}};r.readAsText(f)}
function resetData(){if(confirm("Reset all data to the original demo dataset?")){db=structuredClone(DEMO);save();render();toast("Demo data restored")}}
function exportCSV(){const rows=[["Receipt","Date","Customer","Items","Payment","Total"],...db.sales.map(s=>[s.receipt,s.date,s.customer,s.items.reduce((a,i)=>a+i.qty,0),s.payment,s.total])];const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="eden-mara-sales.csv";a.click()}
function printReceipt(s){if(typeof s==="number")s=db.sales.find(x=>x.id===s);if(!s)return;const items=s.items.map(i=>{const p=db.products.find(x=>x.id===i.productId);return `<tr><td>${esc(p?.name||"Item")} × ${i.qty}</td><td class="right">${money(i.qty*i.price)}</td></tr>`}).join("");const w=window.open("","_blank","width=500,height=700");w.document.write(`<html><head><title>${esc(s.receipt)}</title><style>body{margin:0;background:#eee}.receipt{width:360px;background:white;padding:24px;margin:auto;font-family:Arial}.rlogo{width:110px;height:75px;object-fit:contain;display:block;margin:auto}.center{text-align:center}hr{border:0;border-top:1px dashed #999}table{width:100%;font-size:12px;border-collapse:collapse}td{padding:5px 0}.right{text-align:right}</style></head><body><div class="receipt"><img class="rlogo" src="${LOGO}"><h2 class="center">${esc(db.settings.shopName)}</h2><div class="center">${esc(db.settings.tagline)}</div><p class="center" style="font-size:12px">${esc(db.settings.phone)}<br>${esc(db.settings.address)}</p><hr><p style="font-size:12px">Receipt: <b>${esc(s.receipt)}</b><br>Date: ${s.date} ${s.time||""}<br>Customer: ${esc(s.customer)}</p><table>${items}</table><hr><table><tr><td>Subtotal</td><td class="right">${money(s.subtotal)}</td></tr><tr><td>Tax</td><td class="right">${money(s.tax)}</td></tr><tr><td><b>Total</b></td><td class="right"><b>${money(s.total)}</b></td></tr></table><hr><p class="center" style="font-size:12px">Thank you for shopping with Eden Mara.</p></div><script>window.print();<\/script></body></html>`);w.document.close()}
render();
</script>
</body></html>
